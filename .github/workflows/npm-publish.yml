# This workflow publishes to npm only when the package.json version changes on main.
# It triggers on package.json changes, then compares the previous and current version values.

name: Publish NPM Package

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  id-token: write # required for OIDC
  contents: read
  
jobs:
  version_check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION="$(git show "$BEFORE:package.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          NEW_VERSION="$(git show "$AFTER:package.json"  | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version_check
    if: needs.version_check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
